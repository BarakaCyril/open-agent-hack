# KAMIS price store. Joins the Zetaris compose network so the driver can
# reach it as maize-db. The password is supplied by the environment at
# start time and is not stored in this file.
services:
  maize-db:
    container_name: maize-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maize
      POSTGRES_USER: maize
      POSTGRES_PASSWORD: ${MAIZE_PG_PASSWORD:?set MAIZE_PG_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maize -d maize"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - zetaris_default

networks:
  zetaris_default:
    external: true
